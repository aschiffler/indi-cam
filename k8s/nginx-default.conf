server {
    listen 80;
    server_name  _;
    root /usr/share/nginx/html/fhws-vlab-landing;
    location / {
      add_header Access-Control-Allow-Origin *;
    }
    location /api/ {
      proxy_pass http://instances-proxy.vlab.svc.cluster.local;
    }
    location ~ /\.git {
      deny all;
      return 404;
    }
    # indi-cam web app (configmap indi-cam-web)
    location = /indi-cam {
      absolute_redirect off;
      return 301 /indi-cam/;
    }
    location /indi-cam/ {
      alias /usr/share/nginx/html/indi-cam/;
      index index.html;
      add_header Cache-Control "no-cache";
    }
}
