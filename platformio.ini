; indi-cam: ESP32-S3 camera -> MQTT publisher with WiFi setup portal
;
;   pio run -t upload        build + flash
;   pio device monitor       serial log
;
; Hardware: ESP32-S3 (N16R8: 16 MB flash, 8 MB OPI PSRAM), OV2640,
; Freenove ESP32-S3-WROOM CAM / ESP32-S3-EYE camera pinout, native USB port.
[env:esp32s3cam]
platform = espressif32@^6.9.0
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.3
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial log on the native USB port (USB-Serial/JTAG)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Access point used in init (setup) mode. PSK must be at least 8 characters.
    '-DAP_SSID="indi-cam-setup"'
    '-DAP_PSK="indicam-setup"'
    ; Code that must be entered on the Bluetooth config page. Same for all devices.
    '-DBLE_CODE="indicam-setup"'
